<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotting Calculator Pro — Калькулятор Выброски</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #121212; color: #fff; }
        
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* По умолчанию (Вертикальный режим / Portrait) — во всю ширину экрана сверху */
        .control-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(18, 18, 18, 0.94);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border-bottom: 1px solid #333;
            max-height: 85vh;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        /* Горизонтальный режим (Landscape) — в левом верхнем углу аккуратным блоком */
        @media (orientation: landscape) {
            .control-panel {
                top: 10px;
                left: 10px;
                width: 360px;
                max-width: 45vw;
                border-radius: 8px;
                border: 1px solid #333;
                max-height: calc(100vh - 20px);
            }
        }

        .top-results-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 2px 0 8px 0;
            margin-bottom: 6px;
        }
        .res-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aaa;
        }
        .res-val {
            font-weight: bold;
            color: #00E676;
            font-size: 15px;
        }

        .btn-group { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 8px;
            align-items: center;
        }

        .mode-selector {
            display: flex;
            background: #121212;
            border-radius: 4px;
            padding: 2px;
            border: 1px solid #333;
            flex: 1;
        }
        .mode-selector input[type="radio"] { display: none; }
        .mode-selector label {
            flex: 1;
            padding: 7px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            margin: 0;
            white-space: nowrap;
        }
        .mode-selector input[type="radio"]:checked + label {
            background: #00E676;
            color: #000;
        }

        .btn {
            flex: 1;
            padding: 8px 6px;
            background: #29b6f6;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: #81d4fa; }
        .btn-weather { background: #ab47bc; color: #fff; }
        .btn-weather:hover { background: #ce93d8; }

        .form-group { margin-bottom: 8px; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 4px; }
        span.val { color: #fff; font-weight: bold; }

        .form-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .form-row label {
            font-size: 10px;
            white-space: nowrap;
        }

        input[type="range"] { width: 100%; accent-color: #00E676; }
        input[type="number"] {
            width: 100%; padding: 6px 4px; background: #222; border: 1px solid #444; 
            border-radius: 4px; color: #fff; font-size: 12px; text-align: center;
        }
        input[type="number"]:disabled {
            background: #181818;
            border-color: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }

        .hint { font-size: 10px; color: #777; margin-top: 4px; text-align: center; }
        
        #weatherStatus { font-size: 10px; color: #ab47bc; margin-bottom: 6px; text-align: center; min-height: 12px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <div class="top-results-bar">
            <div class="res-item">
                <span id="lblDistance">Вынос:</span>
                <span class="res-val" id="resDistance">0 м</span>
            </div>
            <div class="res-item">
                <span id="lblTime">Подлет:</span>
                <span class="res-val" id="resTime">0 сек</span>
            </div>
        </div>

        <div class="btn-group">
            <div class="mode-selector">
                <input type="radio" id="modePlane" name="craftMode" value="plane" checked>
                <label for="modePlane">Самолет</label>
                <input type="radio" id="modeBalloon" name="craftMode" value="balloon">
                <label for="modeBalloon">Шар</label>
            </div>
            <button class="btn" id="btnLocate">Геопозиция</button>
            <button class="btn btn-weather" id="btnWeather">Ветер сейчас</button>
        </div>
        <div id="weatherStatus"></div>

        <div class="form-group">
            <label>Направление ветра (откуда): <span class="val" id="windDirVal">270° (Запад)</span></label>
            <input type="range" id="windDir" min="0" max="359" value="270">
        </div>

        <div class="form-group">
            <label>Скорость ветра (м/с): <span class="val" id="windSpeedVal">5 м/с</span></label>
            <input type="range" id="windSpeed" min="0" max="15" step="0.5" value="5">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Отделение (м)</label>
                <input type="number" id="exitAlt" value="1200" min="100" max="10000" step="50">
            </div>

            <div class="form-group">
                <label>Раскрытие (м)</label>
                <input type="number" id="openAlt" value="900" min="100" max="10000" step="50">
            </div>

            <div class="form-group">
                <label id="acSpeedLabel">Скорость ЛА (км/ч)</label>
                <input type="number" id="acSpeed" value="140" min="0" max="1000" step="5">
            </div>
        </div>

        <div class="hint" id="hintText">Кликните по карте или перетащите красную точку</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let defaultLat = 56.702458;
        let defaultLng = 47.887794;

        const map = L.map('map').setView([defaultLat, defaultLng], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const zeroIcon = L.divIcon({
            className: 'custom-icon',
            html: '<div style="background:#FF1744; width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 8px #FF1744;"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        const exitIcon = L.divIcon({
            className: 'custom-icon',
            html: '<div style="background:#00E676; width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 8px #00E676;"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        let zeroMarker = L.marker([defaultLat, defaultLng], {icon: zeroIcon, draggable: true}).addTo(map);
        let exitMarker = L.marker([defaultLat, defaultLng], {icon: exitIcon}).addTo(map);
        let flightPath = L.polyline([], {color: '#00E676', weight: 2, dashArray: '6, 6'}).addTo(map);

        const V_FREEFALL = 50.0;
        const V_CANOPY = 4.5;

        function calculateOffset(lat, lng, distanceMeters, bearingDegrees) {
            const R = 6371000;
            const rad = Math.PI / 180;
            const lat1 = lat * rad;
            const lng1 = lng * rad;
            const brng = bearingDegrees * rad;
            const d = distanceMeters / R;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
            const lng2 = lng1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

            return L.latLng(lat2 / rad, lng2 / rad);
        }

        function recalculate() {
            const isBalloon = document.getElementById('modeBalloon').checked;
            const windDir = parseFloat(document.getElementById('windDir').value);
            const windSpeed = parseFloat(document.getElementById('windSpeed').value);

            let rawExitAlt = parseFloat(document.getElementById('exitAlt').value) || 1200;
            let rawOpenAlt = parseFloat(document.getElementById('openAlt').value) || 900;

            const exitAlt = Math.min(10000, Math.max(100, rawExitAlt));
            const openAlt = Math.min(10000, Math.max(100, Math.min(rawOpenAlt, exitAlt)));

            const ffAlt = Math.max(0, exitAlt - openAlt);
            const t_ff = ffAlt / V_FREEFALL;
            const t_canopy = openAlt / V_CANOPY;
            const t_total = t_ff + t_canopy;

            const distance = windSpeed * t_total;

            const acSpeedInput = document.getElementById('acSpeed');

            if (isBalloon) {
                acSpeedInput.disabled = true;
                acSpeedInput.value = 0;

                const driftBearing = (windDir + 180) % 360;
                const landingLatLng = calculateOffset(zeroMarker.getLatLng().lat, zeroMarker.getLatLng().lng, distance, driftBearing);

                exitMarker.setLatLng(landingLatLng);
                flightPath.setLatLngs([zeroMarker.getLatLng(), landingLatLng]);

                document.getElementById('lblDistance').innerText = "Снос:";
                document.getElementById('lblTime').innerText = "Снижение:";

                document.getElementById('resDistance').innerText = `${Math.round(distance)} м`;
                document.getElementById('resTime').innerText = `${Math.round(t_total)} сек`;
                document.getElementById('hintText').innerText = "Кликните по карте, чтобы задать положение шара";

            } else {
                acSpeedInput.disabled = false;
                if (parseFloat(acSpeedInput.value) === 0) {
                    acSpeedInput.value = 140;
                }

                let rawAcSpeed = parseFloat(acSpeedInput.value) || 140;
                const acSpeedKmH = Math.min(1000, Math.max(0, rawAcSpeed));

                const exitLatLng = calculateOffset(zeroMarker.getLatLng().lat, zeroMarker.getLatLng().lng, distance, windDir);

                const acSpeedMS = acSpeedKmH / 3.6;
                const groundSpeedMS = Math.max(0.1, acSpeedMS - windSpeed);
                const t_fly = distance / groundSpeedMS;

                exitMarker.setLatLng(exitLatLng);
                flightPath.setLatLngs([zeroMarker.getLatLng(), exitLatLng]);

                document.getElementById('lblDistance').innerText = "Вынос:";
                document.getElementById('lblTime').innerText = "Подлет:";

                document.getElementById('resDistance').innerText = `${Math.round(distance)} м`;
                document.getElementById('resTime').innerText = `${Math.round(t_fly)} сек`;
                document.getElementById('hintText').innerText = "Кликните по карте, чтобы задать точку 'Ноль'";
            }

            document.getElementById('windDirVal').innerText = `${windDir}° (${getCompassDirection(windDir)})`;
            document.getElementById('windSpeedVal').innerText = `${windSpeed} м/с`;
        }

        function getCompassDirection(deg) {
            const dirs = ['С', 'ССВ', 'СВ', 'ВСВ', 'В', 'ВЮВ', 'ЮВ', 'ЮЮВ', 'Ю', 'ЮЮЗ', 'ЮЗ', 'ЗЮЗ', 'З', 'ЗСС', 'СЗ', 'ССЗ'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        function getUserLocation() {
            if ("geolocation" in navigator) {
                document.getElementById('weatherStatus').innerText = "Запрос GPS-координат...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        zeroMarker.setLatLng([lat, lng]);
                        map.setView([lat, lng], 15);
                        document.getElementById('weatherStatus').innerText = "";
                        recalculate();
                        fetchWindData(lat, lng);
                    },
                    (error) => {
                        console.warn("Геолокация недоступна:", error.message);
                        document.getElementById('weatherStatus').innerText = "Ошибка получения GPS";
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }

        async function fetchWindData(lat, lng) {
            const statusEl = document.getElementById('weatherStatus');
            statusEl.innerText = "Загрузка метеоданных...";
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`);
                const data = await response.json();
                
                if (data && data.current) {
                    const speed = data.current.wind_speed_10m;
                    const dir = data.current.wind_direction_10m;

                    document.getElementById('windSpeed').value = speed;
                    document.getElementById('windDir').value = dir;
                    statusEl.innerText = "Метеоданные обновлены";
                    setTimeout(() => statusEl.innerText = "", 3000);
                    recalculate();
                }
            } catch (err) {
                console.error("Ошибка загрузки метео:", err);
                statusEl.innerText = "Ошибка загрузки метеоданных";
            }
        }

        document.getElementById('btnLocate').addEventListener('click', getUserLocation);
        document.getElementById('btnWeather').addEventListener('click', () => {
            const pos = zeroMarker.getLatLng();
            fetchWindData(pos.lat, pos.lng);
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', recalculate);
        });

        map.on('click', function(e) {
            zeroMarker.setLatLng(e.latlng);
            recalculate();
        });

        zeroMarker.on('drag', recalculate);

        fetchWindData(defaultLat, defaultLng);
        recalculate();
    </script>
</body>
</html>
