<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электроноль — Приемник</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 12px; text-align: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        
        /* ТАБЛО РЕЗУЛЬТАТОВ */
        .result-box { 
            font-size: 52px; 
            font-weight: 900; 
            margin: 10px 0; 
            padding: 15px 10px; 
            border-radius: 16px; 
            background: #0f172a; 
            border: 3px solid #334155; 
            transition: all 0.15s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            user-select: none;
            word-break: break-word;
        }

        .result-text-sm {
            font-size: 20px !important;
            letter-spacing: 0.5px;
        }

        .result-connect {
            font-size: 22px;
            color: #34d399;
            border-color: #059669;
            background: rgba(6, 95, 70, 0.2);
            cursor: pointer;
        }
        .result-connect:active {
            transform: scale(0.98);
            background: rgba(6, 95, 70, 0.35);
        }

        .result-zero { 
            background: #14532d; 
            border-color: #22c55e; 
            color: #4ade80; 
            text-shadow: 0 0 20px rgba(34,197,94,0.6); 
        }

        /* Таймер */
        .timer-container { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 15px; margin-bottom: 15px; }
        .timer-bar { height: 100%; background: #38bdf8; width: 0%; transition: width 0.1s linear; }
        
        /* Кнопки */
        .btn { color: white; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; width: 100%; margin: 6px 0; }
        .btn:active { transform: scale(0.98); }
        .btn-reset { background: #ef4444; }

        /* Настройка задержки */
        .delay-card { background: #0f172a; border-radius: 14px; padding: 12px; margin-bottom: 16px; border: 1px solid #334155; text-align: left; }
        .delay-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        .delay-controls { display: flex; gap: 10px; align-items: center; }
        .delay-slider { flex-grow: 1; accent-color: #38bdf8; cursor: pointer; }
        
        .btn-confirm { background: #0284c7; padding: 8px 14px; font-size: 13px; font-weight: 700; border-radius: 8px; border: none; color: white; cursor: pointer; transition: opacity 0.2s; }
        .btn-confirm:disabled { background: #334155; color: #64748b; cursor: not-allowed; opacity: 0.6; }

        /* Шапка таблицы и Контейнер Меню */
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; }
        .table-header h3 { margin: 0; font-size: 18px; color: #cbd5e1; }
        
        /* Кнопка Меню */
        .menu-btn { 
            padding: 6px 12px; 
            font-size: 18px; 
            line-height: 1;
            font-weight: bold; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            cursor: pointer; 
            color: #f8fafc; 
            background: #0f172a; 
            transition: background 0.15s;
        }
        .menu-btn:active { transform: scale(0.95); background: #334155; }

        /* Выпадающее меню */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 100;
            min-width: 210px;
            padding: 6px;
            text-align: left;
        }
        .dropdown-menu.show { display: block; }

        .menu-item {
            display: block;
            width: 100%;
            background: transparent;
            color: #f8fafc;
            border: none;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
        }
        .menu-item:active { background: #1e293b; }
        .menu-danger { color: #fca5a5; }
        .menu-divider { border: 0; border-top: 1px solid #334155; margin: 4px 0; }

        /* Таблица */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 6px; border-bottom: 1px solid #334155; text-align: center; }
        th { color: #94a3b8; background: #0f172a; font-size: 12px; }
        
        .row-restored { background-color: rgba(234, 179, 8, 0.1); }
        .label-restored { font-size: 10px; color: #facc15; font-weight: bold; display: block; text-transform: uppercase; margin-bottom: 2px;}
        .label-time { font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="resultDisplay" class="result-box result-connect" onclick="onDisplayClick()">
            Подключить мишень
        </div>
        
        <div class="timer-container"><div id="timerBar" class="timer-bar"></div></div>
        <button class="btn btn-reset" onclick="manualResetCommand()">СБРОС (РУЧНОЙ)</button>
    </div>

    <div class="card">
        <!-- НАСТРОЙКА ЗАДЕРЖКИ -->
        <div class="delay-card">
            <div class="delay-header">
                <span>Задержка блокировки:</span>
                <span id="delayValueText" style="color: #38bdf8;">10 сек</span>
            </div>
            <div class="delay-controls">
                <input type="range" id="delaySlider" class="delay-slider" min="1" max="10" value="10" oninput="onSliderChange()">
                <button id="btnConfirmDelay" class="btn-confirm" disabled onclick="sendDelaySetting()">Подтвердить</button>
            </div>
        </div>
        
        <!-- ШАПКА ТАБЛИЦЫ С МЕНЮ -->
        <div class="table-header">
            <h3>Лог прыжков</h3>
            <div style="position: relative;">
                <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Меню">☰</button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <button class="menu-item" onclick="execMenuAction(requestSync)">Восстановить с мишени</button>
                    <button class="menu-item menu-danger" onclick="execMenuAction(clearAllData)">Стереть везде</button>
                    <div class="menu-divider"></div>
                    <button class="menu-item" onclick="execMenuAction(clearWebOnly)">Очистить таблицу</button>
                </div>
            </div>
        </div>
        
        <table>
            <thead><tr><th>ID</th><th>Дата и Время</th><th>Результат</th></tr></thead>
            <tbody id="logTable"></tbody>
        </table>
    </div>

    <script>
        const BLE_SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const BLE_CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        const codeMap = {"0":"0", "2":"1-2", "4":"3-4", "6":"5-6", "8":"7-8", "10":"9-10", "12":"11-12", "14":"13-14", "16":"15-16"};

        let isConnected = false;
        let isConnecting = false;
        let isLocked = false;
        let timerInterval = null;
        let currentDelaySec = 10;
        let jumpLogs = JSON.parse(localStorage.getItem('jumpLogs')) || [];
        let bleCharacteristic = null;
        let isSyncing = false; 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function initAudioEngine() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(isZero) {
            if (audioCtx.state === 'suspended') return; 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (isZero) {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        function getCurrentDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return `${dateStr} ${timeStr}`;
        }

        function toggleMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('show');
        }

        function closeMenu() {
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.classList.remove('show');
        }

        function execMenuAction(actionFn) {
            closeMenu();
            actionFn();
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdownMenu');
            if (menu && menu.classList.contains('show')) {
                if (!menu.contains(e.target)) {
                    closeMenu();
                }
            }
        });

        function setDisplayStatus(text, isSmall = false, customClass = '') {
            const display = document.getElementById('resultDisplay');
            display.className = 'result-box ' + customClass;
            if (isSmall) {
                display.classList.add('result-text-sm');
            }
            display.innerText = text;
        }

        function renderLogs() {
            const tbody = document.getElementById('logTable');
            let html = '';
            const sortedLogs = [...jumpLogs].sort((a, b) => b.id - a.id);
            sortedLogs.forEach(log => {
                let timeHtml = log.restored ? `<span class="label-restored">Восстановлено</span>` : '';
                timeHtml += `<span class="label-time">${log.time}</span>`;
                let rowClass = log.restored ? 'class="row-restored"' : '';
                html += `<tr ${rowClass}><td><b>#${log.id}</b></td><td>${timeHtml}</td><td><b>${log.result} см</b></td></tr>`;
            });
            tbody.innerHTML = html;
        }

        function onDisplayClick() {
            if (!isConnected && !isConnecting) {
                connectBLE();
            }
        }

        function onSliderChange() {
            const val = document.getElementById('delaySlider').value;
            document.getElementById('delayValueText').innerText = val + " сек";
            const confirmBtn = document.getElementById('btnConfirmDelay');
            confirmBtn.disabled = !(isConnected && parseInt(val) !== currentDelaySec);
        }

        function sendDelaySetting() {
            if (!isConnected || !bleCharacteristic) return;
            const val = parseInt(document.getElementById('delaySlider').value);
            bleCharacteristic.writeValue(new TextEncoder().encode(`SET_DELAY:${val}`)).then(() => {
                currentDelaySec = val;
                document.getElementById('btnConfirmDelay').disabled = true;
            }).catch(console.error);
        }

        function handleJump(jumpId, code, isRestoring) {
            const resultStr = codeMap[code] || "Ошибка";
            
            if (!isRestoring) {
                if (isLocked) return;
                isLocked = true;
                
                setDisplayStatus(resultStr + " см");
                if (resultStr === "0") {
                    document.getElementById('resultDisplay').classList.add('result-zero');
                }
                
                playBeep(resultStr === "0");
                startAutoResetTimer(currentDelaySec);
            }

            const existingIndex = jumpLogs.findIndex(j => j.id === jumpId);
            if (existingIndex !== -1) {
                if (isRestoring && jumpLogs[existingIndex].result !== resultStr) {
                    jumpLogs[existingIndex].result = resultStr;
                    jumpLogs[existingIndex].time = getCurrentDateTime();
                    jumpLogs[existingIndex].restored = true;
                }
            } else {
                jumpLogs.push({ id: jumpId, time: getCurrentDateTime(), result: resultStr, restored: isRestoring });
            }
        }

        function handleBLEData(event) {
            const value = new TextDecoder().decode(event.target.value).trim();
            if (value.startsWith("LIVE:")) {
                const parts = value.split(":");
                handleJump(parseInt(parts[1]), parseInt(parts[2]), false);
                localStorage.setItem('jumpLogs', JSON.stringify(jumpLogs));
                renderLogs();
            } else if (value.startsWith("SYNC:")) {
                const parts = value.split(":");
                handleJump(parseInt(parts[1]), parseInt(parts[2]), true);
            } else if (value === "SYNC_END") {
                isSyncing = false;
                resetUI();
                localStorage.setItem('jumpLogs', JSON.stringify(jumpLogs));
                renderLogs();
                alert("Синхронизация завершена!");
            } else if (value.startsWith("DELAY:")) {
                const delayVal = parseInt(value.split(":")[1]);
                if (delayVal >= 1 && delayVal <= 10) {
                    currentDelaySec = delayVal;
                    document.getElementById('delaySlider').value = delayVal;
                    document.getElementById('delayValueText').innerText = delayVal + " сек";
                    document.getElementById('btnConfirmDelay').disabled = true;
                }
            }
        }

        function requestSync() {
            if (!isConnected || !bleCharacteristic) return alert("Подключите мишень!");
            isSyncing = true;
            setDisplayStatus('СИНХРОНИЗАЦИЯ...', true);
            bleCharacteristic.writeValue(new TextEncoder().encode("SYNC_REQ")).catch(console.error);
        }

        function clearAllData() {
            if (!isConnected) return alert("Подключите мишень для стирания данных на ней!");
            if (confirm('ВНИМАНИЕ! Это действие удалит все данные с телефона И очистит память мишени. Продолжить?')) {
                bleCharacteristic.writeValue(new TextEncoder().encode("CLEAR_ALL")).catch(console.error);
                clearWebOnly(true);
            }
        }

        function clearWebOnly(skipConfirm = false) {
            if (skipConfirm || confirm('Очистить таблицу на телефоне? (Данные на мишени останутся)')) {
                jumpLogs = [];
                localStorage.removeItem('jumpLogs');
                renderLogs();
            }
        }

        function startAutoResetTimer(seconds) {
            clearInterval(timerInterval);
            const timerBar = document.getElementById('timerBar');
            let timeLeft = seconds * 10;
            timerInterval = setInterval(() => {
                timeLeft--;
                timerBar.style.width = ((timeLeft / (seconds * 10)) * 100) + '%';
                if (timeLeft <= 0) {
                    resetUI();
                }
            }, 100);
        }

        function resetUI() {
            clearInterval(timerInterval);
            document.getElementById('timerBar').style.width = '0%';
            isLocked = false;

            if (isConnected && !isSyncing) {
                setDisplayStatus("ГОТОВ");
            } else if (!isConnected) {
                setDisplayStatus("Подключить мишень", true, "result-connect");
            }
        }

        function manualResetCommand() {
            resetUI();
            if (isConnected && bleCharacteristic) {
                bleCharacteristic.writeValue(new TextEncoder().encode("RESET")).catch(() => {});
            }
        }

        function onDisconnected() {
            isConnected = false;
            isConnecting = false;
            bleCharacteristic = null;
            resetUI();
            document.getElementById('btnConfirmDelay').disabled = true;
        }

        async function connectBLE() {
            initAudioEngine();
            try {
                isConnecting = true;
                setDisplayStatus('ПОИСК...', true);

                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32' }],
                    optionalServices: [BLE_SERVICE_UUID]
                });
                device.addEventListener('gattserverdisconnected', onDisconnected);
                
                setDisplayStatus('ПОДКЛЮЧЕНИЕ...', true);
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(BLE_CHAR_UUID);
                
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);
                
                isConnected = true;
                isConnecting = false;
                resetUI();

                setTimeout(() => {
                    if (bleCharacteristic && isConnected) {
                        bleCharacteristic.writeValue(new TextEncoder().encode("GET_DELAY")).catch(console.error);
                    }
                }, 500);

            } catch (error) {
                onDisconnected();
            }
        }

        resetUI();
        renderLogs();
    </script>
</body>
</html>
