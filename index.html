<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электроноль — Приемник</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 12px; text-align: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; background: #334155; color: #94a3b8; margin-bottom: 12px; }
        .status-ready { background: #065f46; color: #34d399; }
        .status-locked { background: #991b1b; color: #fca5a5; }
        
        .result-box { font-size: 64px; font-weight: 900; margin: 10px 0; padding: 15px; border-radius: 16px; background: #0f172a; border: 3px solid #334155; transition: all 0.3s ease; }
        .result-zero { background: #14532d; border-color: #22c55e; color: #4ade80; text-shadow: 0 0 20px rgba(34,197,94,0.6); }
        
        .timer-container { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 15px; margin-bottom: 15px; }
        .timer-bar { height: 100%; background: #38bdf8; width: 0%; transition: width 0.1s linear; }
        
        .btn { color: white; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; width: 100%; margin: 6px 0; }
        .btn:active { transform: scale(0.98); }
        .btn-reset { background: #ef4444; }
        .btn-ble { background: #10b981; }
        
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 16px; }
        .btn-sync { background: #0284c7; }
        .btn-clear-all { background: #7f1d1d; border: 1px solid #ef4444; }
        .btn-clear-web { background: #475569; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 6px; border-bottom: 1px solid #334155; text-align: center; }
        th { color: #94a3b8; background: #0f172a; font-size: 12px; }
        
        .row-restored { background-color: rgba(234, 179, 8, 0.1); }
        .label-restored { font-size: 10px; color: #facc15; font-weight: bold; display: block; text-transform: uppercase; margin-bottom: 2px;}
        .label-time { font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="statusBadge" class="status-badge">НЕ ПОДКЛЮЧЕНО</div>
        <div id="resultDisplay" class="result-box">---</div>
        <div class="timer-container">
            <div id="timerBar" class="timer-bar"></div>
        </div>
        <button class="btn btn-reset" onclick="manualReset()">СБРОС (РУЧНОЙ)</button>
        <button class="btn btn-ble" onclick="connectBLE()">ПОДКЛЮЧИТЬ МИШЕНЬ (BLE)</button>
    </div>

    <div class="card">
        <div class="controls-grid">
            <button class="btn btn-sync" onclick="requestSync()">🔄 Восстановить прыжки с датчика</button>
            <button class="btn btn-clear-all" onclick="clearAllData()">⚠️ Стереть все данные (Датчик + Веб)</button>
            <button class="btn btn-clear-web" onclick="clearWebOnly()">🧹 Очистить таблицу (Только Веб)</button>
        </div>

        <h3 style="margin: 10px 0; text-align: left; font-size: 18px; color: #cbd5e1;">📋 Лог прыжков</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Дата и Время</th>
                    <th>Результат</th>
                </tr>
            </thead>
            <tbody id="logTable"></tbody>
        </table>
    </div>

    <script>
        const BLE_SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const BLE_CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        const codeMap = {
            "0": "0", "2": "1-2", "4": "3-4", "6": "5-6", 
            "8": "7-8", "10": "9-10", "12": "11-12", "14": "13-14", "16": "15-16"
        };

        let isConnected = false;
        let isLocked = false;
        let timerInterval = null;
        let jumpLogs = JSON.parse(localStorage.getItem('jumpLogs')) || [];
        let bleCharacteristic = null;
        let isSyncing = false; 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isZero) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (isZero) {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        function getCurrentDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return `${dateStr} ${timeStr}`;
        }

        // Оптимизированный рендер (в 10 раз быстрее)
        function renderLogs() {
            const tbody = document.getElementById('logTable');
            let html = '';
            
            const sortedLogs = [...jumpLogs].sort((a, b) => b.id - a.id);
            
            sortedLogs.forEach(log => {
                let timeHtml = log.restored ? `<span class="label-restored">Восстановлено</span>` : '';
                timeHtml += `<span class="label-time">${log.time}</span>`;
                let rowClass = log.restored ? 'class="row-restored"' : '';
                
                html += `<tr ${rowClass}>
                    <td><b>#${log.id}</b></td>
                    <td>${timeHtml}</td>
                    <td><b>${log.result} см</b></td>
                </tr>`;
            });
            
            tbody.innerHTML = html;
        }

        function handleJump(jumpId, code, isRestoring) {
            const resultStr = codeMap[code] || "Ошибка";
            
            // МГНОВЕННАЯ РЕАКЦИЯ ИНТЕРФЕЙСА (отделена от тяжелых вычислений массива)
            if (!isRestoring) {
                if (isLocked) return;
                isLocked = true;
                updateStatus('ЗАБЛОКИРОВАНО', 'status-locked');
                
                const display = document.getElementById('resultDisplay');
                display.innerText = resultStr + " см";
                if (resultStr === "0") display.classList.add('result-zero');
                else display.classList.remove('result-zero');
                
                playBeep(resultStr === "0");
                startAutoResetTimer(10);
            }

            const existingIndex = jumpLogs.findIndex(j => j.id === jumpId);
            
            if (existingIndex !== -1) {
                if (isRestoring && jumpLogs[existingIndex].result !== resultStr) {
                    jumpLogs[existingIndex].result = resultStr;
                    jumpLogs[existingIndex].time = getCurrentDateTime();
                    jumpLogs[existingIndex].restored = true;
                }
            } else {
                jumpLogs.push({
                    id: jumpId,
                    time: getCurrentDateTime(),
                    result: resultStr,
                    restored: isRestoring 
                });
            }
        }

        function handleBLEData(event) {
            const value = new TextDecoder().decode(event.target.value).trim();
            
            if (value.startsWith("LIVE:")) {
                const parts = value.split(":");
                // 1. Быстро обновляем интерфейс и пищим
                handleJump(parseInt(parts[1]), parseInt(parts[2]), false);
                
                // 2. Откладываем тяжелую отрисовку таблицы, давая браузеру шанс показать цифры на экране
                setTimeout(() => {
                    localStorage.setItem('jumpLogs', JSON.stringify(jumpLogs));
                    renderLogs();
                }, 10);
                
            } else if (value.startsWith("SYNC:")) {
                const parts = value.split(":");
                handleJump(parseInt(parts[1]), parseInt(parts[2]), true);
                
            } else if (value === "SYNC_END") {
                isSyncing = false;
                updateStatus('ГОТОВ К ПРЫЖКУ', 'status-ready');
                localStorage.setItem('jumpLogs', JSON.stringify(jumpLogs));
                renderLogs();
                alert("✅ Синхронизация завершена!");
            }
        }

        function requestSync() {
            if (!isConnected || !bleCharacteristic) return alert("Подключите мишень!");
            isSyncing = true;
            updateStatus('СИНХРОНИЗАЦИЯ...', '');
            bleCharacteristic.writeValue(new TextEncoder().encode("SYNC_REQ")).catch(console.error);
        }

        function clearAllData() {
            if (!isConnected) return alert("Подключите мишень для стирания данных на ней!");
            if (confirm('ВНИМАНИЕ! Это действие удалит все данные с телефона И очистит память мишени. Продолжить?')) {
                bleCharacteristic.writeValue(new TextEncoder().encode("CLEAR_ALL")).catch(console.error);
                clearWebOnly(true);
            }
        }

        function clearWebOnly(skipConfirm = false) {
            if (skipConfirm || confirm('Очистить таблицу на телефоне? (Данные на мишени останутся)')) {
                jumpLogs = [];
                localStorage.removeItem('jumpLogs');
                renderLogs();
            }
        }

        function updateStatus(text, className) {
            const badge = document.getElementById('statusBadge');
            badge.innerText = text;
            badge.className = `status-badge ${className}`;
        }

        function startAutoResetTimer(seconds) {
            clearInterval(timerInterval);
            const timerBar = document.getElementById('timerBar');
            let timeLeft = seconds * 10;
            timerInterval = setInterval(() => {
                timeLeft--;
                timerBar.style.width = ((timeLeft / (seconds * 10)) * 100) + '%';
                if (timeLeft <= 0) manualReset();
            }, 100);
        }

        function manualReset() {
            clearInterval(timerInterval);
            document.getElementById('timerBar').style.width = '0%';
            const display = document.getElementById('resultDisplay');
            display.classList.remove('result-zero');
            isLocked = false;
            if (isConnected && !isSyncing) {
                display.innerText = "ГОТОВ";
                updateStatus('ГОТОВ К ПРЫЖКУ', 'status-ready');
                if (bleCharacteristic) bleCharacteristic.writeValue(new TextEncoder().encode("RESET")).catch(() => {});
            } else if (!isConnected) {
                display.innerText = "---";
                updateStatus('НЕ ПОДКЛЮЧЕНО', '');
            }
        }

        function onDisconnected() {
            isConnected = false;
            bleCharacteristic = null;
            updateStatus('НЕ ПОДКЛЮЧЕНО', '');
            document.getElementById('resultDisplay').innerText = "---";
            document.getElementById('resultDisplay').classList.remove('result-zero');
        }

        async function connectBLE() {
            try {
                updateStatus('ПОИСК УСТРОЙСТВ...', '');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32' }],
                    optionalServices: [BLE_SERVICE_UUID]
                });
                device.addEventListener('gattserverdisconnected', onDisconnected);
                updateStatus('ПОДКЛЮЧЕНИЕ...', '');
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(BLE_CHAR_UUID);
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);
                isConnected = true;
                manualReset();
            } catch (error) {
                onDisconnected();
                alert('Ошибка: ' + error.message);
            }
        }

        renderLogs();
    </script>
</body>
</html>
