<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электроноль — Приемник</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; text-align: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; background: #334155; color: #94a3b8; margin-bottom: 12px; }
        .status-ready { background: #065f46; color: #34d399; }
        .status-locked { background: #991b1b; color: #fca5a5; }
        
        .result-box { font-size: 64px; font-weight: 900; margin: 15px 0; padding: 20px; border-radius: 16px; background: #0f172a; border: 3px solid #334155; transition: all 0.3s ease; }
        .result-zero { background: #14532d; border-color: #22c55e; color: #4ade80; text-shadow: 0 0 20px rgba(34,197,94,0.6); }
        
        .timer-container { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 15px; }
        .timer-bar { height: 100%; background: #38bdf8; width: 0%; transition: width 0.1s linear; }
        
        .btn { background: #0284c7; color: white; border: none; padding: 16px; font-size: 18px; font-weight: 700; border-radius: 14px; cursor: pointer; width: 100%; margin: 6px 0; }
        .btn:active { transform: scale(0.98); }
        .btn-reset { background: #ef4444; }
        .btn-ble { background: #10b981; }
        .btn-clear { background: #475569; font-size: 12px; padding: 8px; margin-top: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #334155; text-align: center; }
        th { color: #94a3b8; background: #0f172a; }
        
        .row-offline { background-color: rgba(245, 158, 11, 0.15); color: #fcd34d; }
        .offline-label { font-size: 10px; color: #f59e0b; display: block; text-transform: uppercase; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div id="statusBadge" class="status-badge">НЕ ПОДКЛЮЧЕНО</div>
        <div id="resultDisplay" class="result-box">---</div>
        <div class="timer-container">
            <div id="timerBar" class="timer-bar"></div>
        </div>
        <button class="btn btn-reset" onclick="manualReset()">СБРОС (РУЧНОЙ)</button>
        <button class="btn btn-ble" onclick="connectBLE()">ПОДКЛЮЧИТЬ МИШЕНЬ (BLE)</button>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; text-align: left; font-size: 18px;">📋 Лог прыжков</h3>
            <button class="btn btn-clear" style="width: auto;" onclick="clearLogs()">Очистить</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Дата и Время</th>
                    <th>Результат</th>
                </tr>
            </thead>
            <tbody id="logTable"></tbody>
        </table>
    </div>

    <script>
        const BLE_SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const BLE_CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        let isConnected = false;
        let isLocked = false;
        let timerInterval = null;
        let jumpLogs = JSON.parse(localStorage.getItem('jumpLogs')) || [];
        let bleCharacteristic = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(isZero) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isZero) {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        function getCurrentDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return `${dateStr} ${timeStr}`;
        }

        function renderLogs() {
            const tbody = document.getElementById('logTable');
            tbody.innerHTML = '';
            jumpLogs.slice().reverse().forEach((log, idx) => {
                const row = document.createElement('tr');
                if (log.offline) row.className = 'row-offline';
                
                let resultHtml = `<b>${log.result} см</b>`;
                if (log.offline) resultHtml += `<span class="offline-label">Восстановлено</span>`;

                row.innerHTML = `<td><b>${jumpLogs.length - idx}</b></td><td>${log.time}</td><td>${resultHtml}</td>`;
                tbody.appendChild(row);
            });
        }

        function processLiveHit(jumpId, zone) {
            // Отправляем квитанцию получения (ACK) обратно на плату
            if (bleCharacteristic) {
                bleCharacteristic.writeValue(new TextEncoder().encode(`LIVE_ACK:${jumpId}`)).catch(() => {});
            }

            if (isLocked) return;
            isLocked = true;
            updateStatus('ЗАБЛОКИРОВАНО', 'status-locked');
            
            const display = document.getElementById('resultDisplay');
            display.innerText = zone + " см";
            const isZero = (zone === "0");
            if (isZero) display.classList.add('result-zero');
            else display.classList.remove('result-zero');

            playBeep(isZero);

            jumpLogs.push({ id: jumpId, time: getCurrentDateTime(), result: zone, offline: false });
            localStorage.setItem('jumpLogs', JSON.stringify(jumpLogs));
            renderLogs();
            startAutoResetTimer(10);
        }

        function processOfflineHit(jumpId, zone) {
            // Проверка дубликатов: если этот jumpId уже есть в памяти телефона, игнорируем
            const exists = jumpLogs.some(log => log.id === jumpId);
            if (!exists) {
                jumpLogs.push({ id: jumpId, time: getCurrentDateTime(), result: zone, offline: true });
                localStorage.setItem('jumpLogs', JSON.stringify(jumpLogs));
                renderLogs();
            }
        }

        function updateStatus(text, className) {
            const badge = document.getElementById('statusBadge');
            badge.innerText = text;
            badge.className = `status-badge ${className}`;
        }

        function startAutoResetTimer(seconds) {
            clearInterval(timerInterval);
            const timerBar = document.getElementById('timerBar');
            let timeLeft = seconds * 10;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerBar.style.width = ((timeLeft / (seconds * 10)) * 100) + '%';
                if (timeLeft <= 0) manualReset();
            }, 100);
        }

        function manualReset() {
            clearInterval(timerInterval);
            document.getElementById('timerBar').style.width = '0%';
            const display = document.getElementById('resultDisplay');
            display.classList.remove('result-zero');
            isLocked = false;

            if (isConnected) {
                display.innerText = "ГОТОВ";
                updateStatus('ГОТОВ К ПРЫЖКУ', 'status-ready');
                if (bleCharacteristic) bleCharacteristic.writeValue(new TextEncoder().encode("RESET")).catch(() => {});
            } else {
                display.innerText = "---";
                updateStatus('НЕ ПОДКЛЮЧЕНО', '');
            }
        }

        function clearLogs() {
            if (confirm('Очистить всю историю прыжков?')) {
                jumpLogs = [];
                localStorage.removeItem('jumpLogs');
                renderLogs();
            }
        }

        function handleBLEData(event) {
            const value = new TextDecoder().decode(event.target.value).trim();
            
            if (value.startsWith("LIVE:")) {
                const parts = value.split(":");
                const jumpId = parseInt(parts[1]);
                const zone = parts[2];
                processLiveHit(jumpId, zone);
                
            } else if (value.startsWith("SYNC:")) {
                const parts = value.split(":");
                const jumpId = parseInt(parts[1]);
                const zone = parts[2];
                processOfflineHit(jumpId, zone);
                
            } else if (value === "SYNC_END") {
                if (bleCharacteristic) {
                    bleCharacteristic.writeValue(new TextEncoder().encode("ACK")).catch(() => {});
                }
            }
        }

        function onDisconnected() {
            isConnected = false;
            bleCharacteristic = null;
            updateStatus('НЕ ПОДКЛЮЧЕНО', '');
            document.getElementById('resultDisplay').innerText = "---";
            document.getElementById('resultDisplay').classList.remove('result-zero');
        }

        async function connectBLE() {
            try {
                updateStatus('ПОИСК УСТРОЙСТВ...', '');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32' }],
                    optionalServices: [BLE_SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', onDisconnected);

                updateStatus('ПОДКЛЮЧЕНИЕ...', '');
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(BLE_CHAR_UUID);

                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

                isConnected = true;
                manualReset();

                setTimeout(async () => {
                    if (bleCharacteristic && isConnected) {
                        try {
                            await bleCharacteristic.writeValue(new TextEncoder().encode("SYNC_REQ"));
                        } catch (e) {
                            console.error("Ошибка SYNC_REQ:", e);
                        }
                    }
                }, 800);

            } catch (error) {
                onDisconnected();
                alert('Ошибка Bluetooth: ' + error.message);
            }
        }

        renderLogs();
    </script>
</body>
</html>
